# 릴리스 배포 파이프라인 — release 브랜치 위 커밋에 v* 태그를 푸시하면 실행된다.
#
#   git checkout release && git merge main
#   git push origin release
#   git tag v0.1.0 && git push origin v0.1.0
#
# 흐름: 태그 검증 → 서버 테스트 → Docker 이미지 빌드 → ECR 푸시 → SSH로 EC2에서 pull + 재기동
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY — ECR push 권한 IAM 사용자 (deploy/README.md 참조)
#   EC2_HOST     — EC2 공인 IP 또는 도메인
#   EC2_USER     — SSH 사용자 (예: ubuntu)
#   EC2_SSH_KEY  — SSH 개인키 (PEM 전문)
# 선택 Variables:
#   AWS_REGION (기본 ap-northeast-2), ECR_REPOSITORY (기본 catch-my-ride-server),
#   EC2_APP_DIR (기본 /opt/catch-my-ride-server)

name: deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# 배포 중복 실행 방지 — 연속 태그 푸시 시 순차 실행
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'catch-my-ride-server' }}
  APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/catch-my-ride-server' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release 브랜치 포함 여부 검증에 전체 히스토리 필요

      - name: 태그가 release 브랜치 위 커밋인지 검증
        run: |
          git fetch origin release || {
            echo "::error::origin에 release 브랜치가 없습니다. 먼저 release 브랜치를 만들어 푸시하세요."
            exit 1
          }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then
            echo "::error::태그 ${GITHUB_REF_NAME}의 커밋이 release 브랜치에 없습니다. release에 머지 후 태그하세요."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 서버 테스트
        run: ./gradlew --no-daemon test

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인 (러너)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 + ECR 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          # EC2가 Graviton(arm)이면 linux/arm64로 변경
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2용 ECR 임시 비밀번호 발급
        # EC2에 AWS 자격증명을 두지 않기 위해 러너에서 발급해 SSH로 넘긴다 (12시간 유효)
        id: ecr-pass
        run: |
          PASS=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$PASS"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        env:
          GIT_TAG: ${{ github.ref_name }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PASSWORD: ${{ steps.ecr-pass.outputs.password }}
          APP_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GIT_TAG,ECR_REGISTRY,ECR_PASSWORD,APP_IMAGE,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            # compose 파일·Caddyfile도 이미지와 같은 버전으로 맞춘다 (.env는 gitignore라 보존됨)
            git fetch --tags --force origin
            git checkout -q "$GIT_TAG"

            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # compose 변수 주입 — docker-compose.prod.yml의 ${APP_IMAGE}
            echo "APP_IMAGE=$APP_IMAGE" > .deploy.env

            docker compose --env-file .deploy.env -f docker-compose.yml -f docker-compose.prod.yml pull app
            docker compose --env-file .deploy.env -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build app

            # 헬스체크: 최대 100초 대기
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:5000/actuator/health | grep -q '"UP"'; then
                echo "✅ 배포 완료: $APP_IMAGE"
                docker image prune -f > /dev/null
                exit 0
              fi
              sleep 5
            done
            echo "::error::헬스체크 실패 — 최근 로그:"
            docker compose logs --tail 100 app
            exit 1
