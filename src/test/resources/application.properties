# 테스트 공통 오버라이드 — main의 application.yml과 함께 로드되며 이 값이 우선한다.
# (같은 이름 application.yml을 두면 main 설정을 통째로 가리므로 반드시 .properties로 유지할 것)
# DB는 인메모리 H2(PostgreSQL 모드): 외부 의존 없이 schema.sql 그대로 돈다.
spring.datasource.url=jdbc:h2:mem:catchmyride-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# 테스트에선 자기 호출 워밍업 비활성 — MOCK 환경엔 실제 서버가 없어 실패 로그만 남는다
warmup.enabled=false
# 푸시 스케줄러 백그라운드 틱 비활성 — 스케줄러 테스트는 tick()을 직접 호출한다
push.enabled=false
