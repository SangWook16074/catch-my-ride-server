server:
  port: 5000 # EC2에서 8080은 기존 서비스가 사용 중 — 이 서버는 5000으로 통일(compose·Caddy·CI 헬스체크 동일)

spring:
  application:
    name: catchmyride-server
  datasource:
    # 로컬 bootRun은 localhost, docker compose는 SPRING_DATASOURCE_URL로 postgres 서비스를 가리킨다
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catchmyride}
    username: ${SPRING_DATASOURCE_USERNAME:catchmyride}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      keepalive-time: 240000 # 4분 — 유휴 커넥션을 주기 검증해 첫 요청이 TCP 재수립 비용을 내지 않게
  mvc:
    servlet:
      load-on-startup: 1 # DispatcherServlet을 기동 시 초기화 — 재배포 후 첫 요청 지연 제거
  sql:
    init:
      mode: always # schema.sql의 CREATE TABLE IF NOT EXISTS 실행 — Phase 1 안정화 후 Flyway 검토

# 응답 시간 모니터링 — 개별 요청은 RequestTimingFilter 로그, 집계(p50/p95/p99)는
# GET /actuator/metrics/http.server.requests (URI별: ?tag=uri:/api/v1/arrivals)
management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  metrics:
    distribution:
      percentiles:
        "[http.server.requests]": 0.5, 0.95, 0.99

# 유휴 후 첫 호출 지연 방지 — KeepAliveWarmer 자기 호출 주기 (warmup.enabled=false로 끔)
warmup:
  interval: PT4M

admin:
  # /api/admin/monitoring·/monitoring.html 대시보드 보호 토큰 (X-Admin-Token 헤더로 검사).
  # 빈 값이면 개방 — dev-user-key와 같은 Phase 1 편의. VM .env에는 반드시 넣을 것.
  token: ${ADMIN_TOKEN:}

# 푸시 알림 (API.md §4, S-5/S-6) — api-key·템플릿 코드가 비면 dry-run(스케줄러는 돌고 push_log만 기록).
# P0-7 템플릿 검수 통과 후 승인된 templateSetCode와 파트너 api-key를 env로 넣으면 라이브 전환된다.
push:
  enabled: true
  interval: PT30S # 발송 판단 주기 — 라이브 뷰 폴링(FR-204)과 같은 30초
  api-key: ${APPS_IN_TOSS_API_KEY:}
  template-pre: ${PUSH_TEMPLATE_PRE:}       # 예: CATCHMYRIDE_DEPARTURE_PRE (docs/push-templates.md)
  template-remind: ${PUSH_TEMPLATE_REMIND:} # 예: CATCHMYRIDE_DEPARTURE_REMIND

# 네이버클라우드 Maps (API.md §6 지도 미리보기·§7 지오코딩) — 키 미설정이면 두 엔드포인트는 503
# (클라이언트가 OSM 폴백/안내 문구로 강등). 🧑 NCP 콘솔 > Maps에서 Static Map·Geocoding 이용 신청 후 발급
ncp:
  maps:
    key-id: ${NCP_MAP_KEY_ID:}
    key: ${NCP_MAP_KEY:}

auth:
  # 토스 로그인(clientId)이 열리기 전까지의 로컬/E2E용 고정 유저 (SERVER_FEEDBACK.md §3).
  # 배포에서 실인증을 붙일 때(S-3) 빈 값으로 두면 헤더 없는 요청은 401이 된다.
  dev-user-key: ${AUTH_DEV_USER_KEY:dev-user}
  # 토스 로그인 파트너 API (API.md §8) — mTLS 인증서(PKCS12) 경로가 비면 비활성:
  # /api/v1/auth/*는 503, 요청 인증은 위 dev-user-key 폴백. 🧑 콘솔 약관 동의 → 인증서 발급 후
  # EC2 .env에 TOSS_MTLS_KEYSTORE(예: /app/secrets/toss-mtls.p12)·비밀번호를 넣으면 라이브 전환.
  toss:
    base-url: https://apps-in-toss-api.toss.im
    keystore-path: ${TOSS_MTLS_KEYSTORE:}
    keystore-password: ${TOSS_MTLS_KEYSTORE_PASSWORD:}

spike:
  polling:
    interval: PT30S       # 폴링 주기 (실측용 — 본편 FR-204와는 별개)
    window-start: "06:30" # 실측 시간대 시작 (Asia/Seoul)
    window-end: "09:30"
    weekdays-only: true
  log-dir: ./spike-logs
  keys:
    # 공공데이터포털 "Encoding" 인증키를 그대로 넣는다 (코드에서 재인코딩하지 않음)
    data-go-kr: ${DATA_GO_KR_KEY:}
    # 서울열린데이터광장 인증키
    seoul-open-data: ${SEOUL_OPEN_DATA_KEY:}
  targets:
    # 베타 타겟 노선 확정 후 채울 것 (TASK.md P0-3 참조)
    seoul-bus: []       # TOPIS arsId — 정류소 번호 5자리, 예: "23285"
    gyeonggi-bus: []    # GBIS stationId, 예: "228000723"
    subway: []          # 역명, 예: "여의도"
